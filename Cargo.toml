[workspace]
members = ["crates/focus-core", "src-tauri"]
default-members = ["crates/focus-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
opt-level = "s"
