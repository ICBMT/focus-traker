name: Focus checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web, privacy regressions, and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check:release
      - run: npm run test:release
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-checks
          path: .cache/e2e/
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: ${{ matrix.label }} native checks and unsigned packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Ubuntu (first QA priority)
            target: linux-x86_64
            bundles: deb,appimage
            bundle-root: target/release/bundle
            extra-args: ''
          - os: windows-latest
            label: Windows
            target: windows-x86_64
            bundles: nsis
            bundle-root: target/release/bundle
            extra-args: ''
          - os: macos-latest
            label: macOS universal
            target: macos-universal
            bundles: dmg
            bundle-root: target/universal-apple-darwin/release/bundle
            extra-args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: native-${{ matrix.os }}
      - name: Linux native and headless WebKit prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb xauth webkit2gtk-driver
      - name: Both macOS architectures
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --all -- --check
      - run: node scripts/run-check.mjs -- cargo test --workspace --locked
      - run: node scripts/run-check.mjs -- cargo clippy --workspace --all-targets --locked -- -D clippy::correctness -D clippy::suspicious
      - name: Collect runtime dependency notices
        run: node scripts/run-check.mjs -- node scripts/licenses.mjs --rust
      - name: Build unsigned installable test packages
        run: node scripts/run-check.mjs -- npm run tauri -- build --ci --bundles ${{ matrix.bundles }} ${{ matrix.extra-args }}
      - name: Install development-only native WebDriver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Real Tauri/Rust/WebKit smoke (not a hardware test)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/native-smoke.mjs target/release/focus-desktop
      - name: Catalog packages and SHA-256 hashes
        run: node scripts/package-artifacts.mjs ${{ matrix.bundle-root }} .cache/packages/${{ matrix.target }} ${{ matrix.target }} unsigned-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-unsigned-test-${{ matrix.target }}
          path: .cache/packages/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && runner.os == 'Linux'
        with:
          name: native-webkit-checks
          path: |
            .cache/native-smoke/result.json
            .cache/native-smoke/*.png
            .cache/native-smoke/driver.log
            .cache/native-smoke/failure-ui.json
          if-no-files-found: ignore
          retention-days: 7
